<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#cyanPurple)" stroke-width="2.5"/>

  <!-- Server/Packet Circuit Lines -->
  <path d="M12 20 L24 20 M12 44 L24 44" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="24" cy="20" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="24" cy="44" r="2" fill="#00f0ff" opacity="0.6"/>

  <!-- Titan "T" + Fast Packet Beam Logo -->
  <path d="M16 16 H48 V24 H36 V48 H28 V24 H16 Z" fill="url(#cyanPurple)" filter="url(#glow)"/>

  <!-- Fast Data Packet Accent -->
  <polygon points="40,28 46,36 40,44 44,36" fill="#00f0ff" filter="url(#glow)"/>
</svg>